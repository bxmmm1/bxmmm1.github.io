name: Deploy

# The site's source lives in a private repo. This workflow checks it out with a
# read-only deploy key, publishes it to GitHub Pages, then deletes the uploaded
# artifact, so this repo never holds the site's files or their history.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: bxmmm1/benja-cv
          ref: master
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: site

      - name: Record the source commit
        id: src
        run: echo "sha=$(git -C site rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Drop repo-only files
        run: rm -f site/README.md

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

      # Pages treats the build version as unique per deployment. It defaults to
      # this repo's commit, which never changes here, so use the source commit.
      - id: deploy
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ steps.src.outputs.sha }}

      - name: Delete the uploaded artifact
        if: always() && steps.upload.outputs.artifact_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.upload.outputs.artifact_id }}"
