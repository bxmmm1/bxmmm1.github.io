name: Deploy

# The site's source lives in a private repo. This workflow checks it out with a
# read-only deploy key, publishes it to GitHub Pages, then deletes the uploaded
# artifact, so this repo never holds the site's files or their history.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: bxmmm1/benja-cv
          ref: master
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: site

      - name: Record the source commit
        id: src
        run: echo "sha=$(git -C site rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Drop repo-only files
        run: rm -f site/README.md

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

      # actions/deploy-pages labels each deployment with this repo's commit, which
      # only changes when this workflow does, and Pages quietly skips a label it
      # has already deployed. The label must be a commit in this repo, so make a
      # new one for each run without putting it on any branch (history stays as
      # is), then create the deployment and wait for it as deploy-pages does.
      - id: deploy
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          RUN_LABEL: ${{ steps.src.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha })
            const { data: marker } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `Pages deploy (run ${context.runId})`,
              tree: head.tree.sha,
              parents: [context.sha],
            })
            const buildVersion = marker.sha
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: buildVersion,
              oidc_token: await core.getIDToken(),
            })
            const id = data.id || data.status_url.split('/').pop()
            core.info(`Created Pages deployment ${id} for ${process.env.RUN_LABEL}`)
            core.setOutput('page_url', data.page_url)
            for (let i = 0; i < 120; i++) {
              await new Promise((resolve) => setTimeout(resolve, 5000))
              const { data: d } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })
              if (d.status === 'succeed') return core.info('Deployed')
              if (/failed|cancelled|lost/.test(d.status)) return core.setFailed(`Pages deployment ended with ${d.status}`)
              core.info(`Status: ${d.status}`)
            }
            core.setFailed('Timed out waiting for the Pages deployment')

      - name: Delete the uploaded artifact
        if: always() && steps.upload.outputs.artifact_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.upload.outputs.artifact_id }}"
